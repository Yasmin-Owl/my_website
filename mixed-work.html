<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Work - Yasmin Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://use.typekit.net/dcc4pra.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="intex.html" class="logo">
            <img src="assets/logo.svg" alt="Maxim" class="logo-image">
        </a>
        <ul class="nav-links">
            <li><a href="works.html">Works</a></li>
            <li><a href="about.html">About me</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Mixed Work Section -->
    <section class="posters-section">
        <h1>Mixed Work</h1>
        <div class="posters-container">
            <div class="poster-item">
                <div class="poster-image">
                    <img src="assets/Group 6.png" alt="Mixed Work">
                </div>
                <div class="poster-text">
                    <p>Mixed work project.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container-fluid px-4 px-lg-5 footer-inner">
            <div class="footer-left">Yasmin Gendelevich  2026</div>
            <div class="footer-right">Portfolio</div>
        </div>
    </footer>
    <script>
        (function(){
            var nav = document.querySelector('.navbar');
            window.addEventListener('scroll', function(){
                nav.classList.toggle('scrolled', window.scrollY > 10);
            });
        })();
    </script>
    <script>
        (function(){
            var lastTime = 0;
            var minInterval = 45; // ms between spawned stars

            document.addEventListener('mousemove', function(e){
                var now = Date.now();
                if (now - lastTime < minInterval) return;
                lastTime = now;

                var star = document.createElement('img');
                star.src = 'assets/Star_2.png';
                star.alt = '';
                star.className = 'star-trail';

                var size = 10 + Math.random() * 12;
                star.style.width = size + 'px';
                star.style.left = (e.clientX - size / 2) + 'px';
                star.style.top = (e.clientY - size / 2) + 'px';
                star.style.setProperty('--drift-x', (Math.random() * 40 - 20) + 'px');
                star.style.setProperty('--rotate', (Math.random() * 60 - 30) + 'deg');

                document.body.appendChild(star);

                star.addEventListener('animationend', function(){
                    star.remove();
                });
            });
        })();
    </script>
</body>
</html>
