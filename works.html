    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            var nav = document.querySelector('.navbar');
            window.addEventListener('scroll', function(){
                nav.classList.toggle('scrolled', window.scrollY > 10);
            });
        })();
    </script>
    <script>
        (function(){
            var section = document.getElementById('postersScrollSection');
            var stickyEl = document.querySelector('.posters-sticky');
            var posters = document.querySelectorAll('#postersFan .fan-poster');
            var fanContainer = document.getElementById('postersFan');
            var navbar = document.querySelector('.navbar');
            if (!section || !posters.length) return;

            // Maps each fan poster (in DOM order) to its target grid cell index (0-5, left-to-right, top-to-bottom)
            var gridIndexForFan = [3, 5, 0, 4, 1, 2];

            // All posters share the same ~1.4142 (root 2 / A-series) aspect ratio (height / width)
            var POSTER_ASPECT = 1.4142;

            // Recomputed only on load/resize (NOT on scroll) — the row offsets are fixed relative
            // to the grid container's own center, so once the sticky pin releases, the whole grid
            // scrolls away with the page instead of being re-anchored to the viewport every frame.
            var gridLayout = null;

            function getFanConfig(){
                var mobile = window.innerWidth < 768;
                return mobile
                    ? { width: 150, positions: [{x:-142,y:0,r:-15},{x:-86,y:0,r:-9},{x:-29,y:0,r:-3},{x:29,y:0,r:3},{x:86,y:0,r:9},{x:142,y:0,r:15}] }
                    : { width: 280, positions: [{x:-269,y:0,r:-15},{x:-161,y:0,r:-9},{x:-53,y:0,r:-3},{x:53,y:0,r:3},{x:161,y:0,r:9},{x:269,y:0,r:15}] };
            }

            // How much scroll distance (px) the fan->grid transition itself should take.
            function getTransitionBudget(){
                return window.innerWidth < 768 ? 320 : 450;
            }

            // Computes a 3x2 grid, sized/positioned purely from breakpoint constants (width, gap,
            // margin) — no live viewport measurement — so the row/column offsets stay fixed once
            // computed and never fight normal page scrolling.
            function computeGridLayout(){
                var mobile = window.innerWidth < 768;
                var navBottom = navbar ? navbar.getBoundingClientRect().bottom : (mobile ? 118 : 130);
                // Top margin (clearance below the navbar) is intentionally larger than the bottom
                // margin/row gap so the grid never feels cramped against the navbar.
                var topMargin = mobile ? 60 : 110;
                var bottomMargin = mobile ? 14 : 24;
                var gap = mobile ? 14 : 24;

                var fanWidth = getFanConfig().width;
                var availableW = Math.min(window.innerWidth, 1100) - (mobile ? 24 : 48);
                var maxWidthByWidth = (availableW - 2 * gap) / 3;
                var width = Math.max(60, Math.min(fanWidth, maxWidthByWidth));
                var height = width * POSTER_ASPECT;

                // Total content height: top margin (clears navbar) + 2 rows + row gap + bottom margin
                var contentHeight = topMargin + height + gap + height + bottomMargin;

                // Row centers relative to the content box's own vertical center (fixed constants)
                var row1Y = (topMargin + height / 2) - contentHeight / 2;
                var row2Y = (topMargin + height + gap + height / 2) - contentHeight / 2;
                var colGap = width + gap;

                var stickyHeight = Math.max(window.innerHeight, navBottom + contentHeight);

                return {
                    width: width,
                    contentHeight: contentHeight,
                    stickyHeight: stickyHeight,
                    navBottom: navBottom,
                    topMargin: topMargin,
                    positions: [
                        {x:-colGap,y:row1Y,r:0}, {x:0,y:row1Y,r:0}, {x:colGap,y:row1Y,r:0},
                        {x:-colGap,y:row2Y,r:0}, {x:0,y:row2Y,r:0}, {x:colGap,y:row2Y,r:0}
                    ]
                };
            }

            // Where the grid content's vertical center should sit (in viewport px), for a given
            // transition progress: at progress 0 (fan pose) it's the true viewport middle; as the
            // grid forms it shifts to sitting right below the navbar, since the full 2-row grid is
            // often taller than one viewport and needs to grow downward, not center on screen.
            function getDesiredCenterY(progress, grid){
                var centerYFan = window.innerHeight / 2;
                // Row 1's own offset (row1Y) is already measured relative to the container's
                // center and bakes in topMargin from the container's top edge — so the container's
                // top edge itself must land at navBottom (not navBottom + topMargin), otherwise
                // topMargin gets counted twice and row 1 ends up too close to (or under) the navbar.
                var centerYGrid = grid.navBottom + grid.contentHeight / 2;
                return centerYFan + (centerYGrid - centerYFan) * progress;
            }

            // Grows the sticky box (and the section's scroll budget) to fit the full-size grid,
            // so the grid is never clipped and never bleeds into the next section — no shrinking,
            // no dead blank space either. If the grid fits within one screen, this is a no-op
            // (stays at 100vh); it only grows when the fixed-size grid genuinely needs more room.
            function layoutSection(){
                gridLayout = computeGridLayout();
                fanContainer.style.height = gridLayout.contentHeight + 'px';
                stickyEl.style.height = gridLayout.stickyHeight + 'px';
                section.style.minHeight = (gridLayout.stickyHeight + getTransitionBudget()) + 'px';
            }

            function update(){
                var fan = getFanConfig();
                var grid = gridLayout;
                var rect = section.getBoundingClientRect();
                var scrolled = -rect.top;
                var holdStartPx = 16;
                var progress = Math.max(0, Math.min(1, (scrolled - holdStartPx) / getTransitionBudget()));

                var centerY = getDesiredCenterY(progress, grid);
                fanContainer.style.top = (centerY - grid.contentHeight / 2) + 'px';

                posters.forEach(function(img, i){
                    var f = fan.positions[i];
                    var g = grid.positions[gridIndexForFan[i]];
                    var x = f.x + (g.x - f.x) * progress;
                    var y = f.y + (g.y - f.y) * progress;
                    var r = f.r + (g.r - f.r) * progress;
                    var width = fan.width + (grid.width - fan.width) * progress;
                    img.style.width = width + 'px';
                    img.style.transform = 'translate(-50%, -50%) translate(' + x + 'px, ' + y + 'px) rotate(' + r + 'deg)';
                });
            }

            function refresh(){
                layoutSection();
                update();
            }

            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', refresh);
            refresh();
        })();
    </script>

    <script>
        (function(){
            var letters = ['A','B','C','D','E','F','G','H','K','M','N','R','S','T','Y','a','b','e','g','k','m','n','r','s','t','y','?','!','*','&'];
            var fontClasses = ['clay-font', 'karat-font'];
            var container = document.getElementById('fontsTeaserLetters');
            if (!container) return;

            // Pick a random sample of letters (no repeats) and give each a random font + tilt.
            var shuffled = letters.slice().sort(function(){ return Math.random() - 0.5; });
            var picked = shuffled.slice(0, 9);

            picked.forEach(function(ch){
                var a = document.createElement('a');
                a.href = 'fonts.html';
                a.className = 'fonts-teaser-letter ' + fontClasses[Math.floor(Math.random() * fontClasses.length)];
                a.textContent = ch;
                a.style.setProperty('--tilt', (Math.random() * 16 - 8) + 'deg');
                container.appendChild(a);
            });
        })();
    </script>

    <script>
        (function(){
            var lastTime = 0;
            var minInterval = 45; // ms between spawned stars

            document.addEventListener('mousemove', function(e){
                var now = Date.now();
                if (now - lastTime < minInterval) return;
                lastTime = now;

                var star = document.createElement('img');
                star.src = 'assets/Star_2.png';
                star.alt = '';
                star.className = 'star-trail';

                var size = 10 + Math.random() * 12;
                star.style.width = size + 'px';
                star.style.left = (e.clientX - size / 2) + 'px';
                star.style.top = (e.clientY - size / 2) + 'px';
                star.style.setProperty('--drift-x', (Math.random() * 40 - 20) + 'px');
                star.style.setProperty('--rotate', (Math.random() * 60 - 30) + 'deg');

                document.body.appendChild(star);

                star.addEventListener('animationend', function(){
                    star.remove();
                });
            });
        })();
    </script>
</body>
</html>
